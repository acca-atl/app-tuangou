<!DOCTYPE html>
<html lang="zh-Hans">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>名厨刘姐面食团购报名</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="page-shell">
      <header class="topbar">
        <p class="eyebrow">团购报名</p>
        <h1>名厨刘姐面食</h1>
      </header>

      <main class="content-grid">
        <section class="panel">
          <div class="panel-header">
            <h2>商品目录</h2>
          </div>
          <div id="catalog" class="catalog"></div>
        </section>

        <aside class="panel">
          <div class="panel-header">
            <h2>报名信息</h2>
          </div>

          <form id="signup-form" class="signup-form">
            <label>
              姓名
              <input type="text" name="name" placeholder="请输入姓名" required />
            </label>

            <label>
              电话
              <input type="tel" name="phone" placeholder="请输入手机号" required />
            </label>

            <label>
              备注
              <textarea name="notes" rows="4" placeholder="例如：送货时间、特别要求等"></textarea>
            </label>

            <div class="order-summary-box">
              <div class="summary-row">
                <span>已选件数</span>
                <strong id="selected-count">0</strong>
              </div>
              <div class="summary-row total-row">
                <span>总金额</span>
                <strong id="total-price">$0</strong>
              </div>
            </div>

            <button class="primary-btn" type="submit">提交报名</button>
          </form>
        </aside>
      </main>

      <section class="panel report-panel">
        <div class="report-header">
          <h2>汇总报表</h2>
          <button id="refresh-report" class="secondary-btn" type="button">刷新</button>
        </div>

        <div class="stats-grid">
          <div class="stat-card">
            <span>订单数</span>
            <strong id="order-count">0</strong>
          </div>
          <div class="stat-card">
            <span>总件数</span>
            <strong id="item-count">0</strong>
          </div>
          <div class="stat-card">
            <span>总收入</span>
            <strong id="revenue-total">$0</strong>
          </div>
        </div>

        <div id="report-items" class="report-items"></div>
        <div class="report-orders-wrap">
          <h3>报名名单</h3>
          <div id="report-orders" class="report-orders"></div>
        </div>
      </section>
    </div>

    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
    <script src="/firebase-config.js"></script>
    <script src="/app.js"></script>
  </body>
</html>
